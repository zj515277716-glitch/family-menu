name: CI

on:
  push:
    # T-Q04 AC1：全分支触发，功能分支推送即见门禁结果（PR 触发保留）
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: family_menu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://app:app_password@localhost:5432/family_menu

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Run database migrations
        run: pnpm --filter @family-menu/api prisma migrate deploy

      - name: Seed database
        run: pnpm --filter @family-menu/api prisma db seed

      - name: Test (contract + seed + taboo + engine)
        run: pnpm test
