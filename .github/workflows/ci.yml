name: CI

on:
  push:
    # T-Q04 AC1：全分支触发，功能分支推送即见门禁结果（PR 触发保留）
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: family_menu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://app:app_password@localhost:5432/family_menu

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Run database migrations
        run: pnpm --filter @family-menu/api prisma migrate deploy

      - name: Seed database
        run: pnpm --filter @family-menu/api prisma db seed

      - name: Test (contract + seed + taboo + engine)
        run: pnpm test

  # ── T-Q04 b1：main 门禁全绿后构建镜像推阿里云 ACR（生产部署改拉镜像，不在生产机构建） ──
  # registry/命名空间为公开信息直接写死；凭据只走 Secrets（ACR_USERNAME/ACR_PASSWORD）。
  # GIT_COMMIT 注入短哈希：与 /health 版本口径（version.ts）及 deploy-api.mjs 的 DEPLOY_TAG 对齐。
  docker:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve short commit sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: crpi-4mmffpuwe56fjgxc.cn-guangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ACR 个人版不认 buildx 默认附加的 OCI attestation（vnd.oci.empty.v1+json）manifest，必须关
          provenance: false
          build-args: |
            GIT_COMMIT=${{ env.SHORT_SHA }}
          tags: |
            crpi-4mmffpuwe56fjgxc.cn-guangzhou.personal.cr.aliyuncs.com/family-menu/family-menu-api:${{ env.SHORT_SHA }}
            crpi-4mmffpuwe56fjgxc.cn-guangzhou.personal.cr.aliyuncs.com/family-menu/family-menu-api:latest
