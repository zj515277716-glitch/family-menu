services:
  # ── local profile：本地开发（Docker PG18） ──
  # 用法：docker compose --profile local up -d
  db:
    image: postgres:18
    container_name: family-menu-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: family_menu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d family_menu"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["local"]

  # ── prod profile：生产部署（ECS + RDS，不含 db） ──
  # 对齐实施方案第643-647行：prod ECS内网连RDS，.env不进git
  # 对齐实施方案第84行：直连IP:3000(过渡期) / Caddy(443, 备案后)
  # 用法：docker compose --profile prod up -d --build
  api:
    build:
      context: .
      dockerfile_inline: |
        FROM node:22-slim AS builder
        RUN corepack enable
        WORKDIR /app
        COPY package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc tsconfig.base.json ./
        COPY packages/ ./packages/
        COPY apps/ ./apps/
        COPY tools/ ./tools/
        RUN pnpm install --frozen-lockfile
        ENV DATABASE_URL="postgresql://placeholder:placeholder@localhost:5432/placeholder"
        RUN pnpm --filter @family-menu/shared build \
            && pnpm --filter @family-menu/engine build \
            && pnpm --filter @family-menu/list-merger build \
            && pnpm --filter @family-menu/api build

        FROM node:22-slim AS runner
        WORKDIR /app
        COPY --from=builder /app/ ./
        ENV NODE_ENV=production
        EXPOSE 3000
        CMD ["node", "apps/api/dist/server.js"]
    container_name: family-menu-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ACCESS_TOKEN: ${ACCESS_TOKEN}
      PORT: "3000"
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    profiles: ["prod"]

  caddy:
    image: caddy:2
    container_name: family-menu-caddy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["prod"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
