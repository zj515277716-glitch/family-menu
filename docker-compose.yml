services:
  # ── local profile：本地开发（Docker PG18） ──
  # 用法：docker compose --profile local up -d
  db:
    image: postgres:18
    container_name: family-menu-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: family_menu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d family_menu"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["local"]

  # ── prod profile：生产部署（ECS + RDS，不含 db） ──
  # 对齐实施方案第643-647行：prod ECS内网连RDS，.env不进git
  # 对齐实施方案第84行：直连IP:3000(过渡期) / Caddy(443, 备案后)
  # 用法：本地一条命令 pnpm deploy:api（T-Q04b2 起，镜像自 ACR 拉取，生产机不再构建）
  api:
    # API_TAG 由 deploy:api 传入（=提交短哈希）；手动 up 时缺省 latest。
    # T-Q04b2 裁决：生产机构建与红线「不在生产服务器上做大构建」冲突，镜像改由 CI 推 ACR。
    image: crpi-4mmffpuwe56fjgxc.cn-guangzhou.personal.cr.aliyuncs.com/family-menu/family-menu-api:${API_TAG:-latest}
    container_name: family-menu-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ACCESS_TOKEN: ${ACCESS_TOKEN}
      PORT: "3000"
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http');const req=http.get('http://localhost:3000/health',r=>{process.exit(r.statusCode===200?0:1)});req.on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always
    profiles: ["prod"]

  caddy:
    image: caddy:2
    container_name: family-menu-caddy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./h5-dist:/srv/h5:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: always
    profiles: ["prod"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
