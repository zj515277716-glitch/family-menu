services:
  # ── local profile：本地开发（Docker PG18） ──
  # 用法：docker compose --profile local up -d
  db:
    image: postgres:18
    container_name: family-menu-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: family_menu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d family_menu"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["local"]

  # ── prod profile：生产部署（ECS + RDS，不含 db） ──
  # 对齐实施方案第643-647行：prod ECS内网连RDS，.env不进git
  # 对齐实施方案第84行：直连IP:3000(过渡期) / Caddy(443, 备案后)
  # 用法：docker compose --profile prod up -d --build
  api:
    build:
      context: .
      dockerfile: Dockerfile
      # ── 构建资源限制（2026-09-14 OOM 治理，用户裁决：build 限资源，不升配） ──
      # NODE_OPTIONS 钳制构建容器内 node 堆（pnpm install/tsc 峰值），超限 build 失败可重试，
      # 不伤系统。勿移除。另两层见 docs/deploy.md「三、构建资源限制」：
      # dockerd 侧 GOMEMLIMIT（systemd drop-in）+ deploy.sh 构建前内存预检。
      # 注：compose v2.27.0 build 段不支持 memory/cpus/memory_swap 字段（config 校验拒绝，需 v2.35+），
      # 故资源限制不经 build 段资源字段表达。
      args:
        NODE_OPTIONS: --max-old-space-size=768
    container_name: family-menu-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ACCESS_TOKEN: ${ACCESS_TOKEN}
      PORT: "3000"
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http');const req=http.get('http://localhost:3000/health',r=>{process.exit(r.statusCode===200?0:1)});req.on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always
    profiles: ["prod"]

  caddy:
    image: caddy:2
    container_name: family-menu-caddy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./h5-dist:/srv/h5:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: always
    profiles: ["prod"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
