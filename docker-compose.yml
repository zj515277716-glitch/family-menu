services:
  db:
    image: postgres:18
    container_name: family-menu-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: family_menu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d family_menu"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["local"]

volumes:
  pgdata:
