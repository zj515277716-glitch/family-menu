<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>空手场景 · 全套屏原型 S-07</title>
<link rel="stylesheet" href="../style.css?v=4">
<link rel="stylesheet" href="./v3.css?v=4">
</head>
<body>
<div class="page">
  <div class="proto-badge"><span>全套屏原型 · 方向① v3 网格卡片风 · S-07 空手场景（两型）</span></div>

  <header class="topbar">
    <a class="back" href="meal-setup.html">‹ 返回设置</a>
    <h1>明天三餐出不来？</h1>
    <p class="sub">如实说明是哪一餐、因为什么，绝不拿假菜单凑数</p>
  </header>

  <!-- 型一：无菜型 -->
  <section class="section">
    <div class="card">
      <div class="demo-head"><span class="demo-tag">演示态：无菜型</span></div>
      <div class="form-title">晚餐凑不出来</div>
      <div class="form-note">必消「鸡蛋」与临时忌口「鸡蛋」冲突，符合要求的菜没有了。</div>
      <div class="opts">
        <a class="opt" href="#">去掉临时忌口「鸡蛋」</a>
        <a class="opt" href="#">删掉必消「鸡蛋」</a>
        <a class="opt" href="#">换个想吃的菜</a>
      </div>
      <div class="btn-row">
        <a class="btn" href="generating.html">调好重新生成</a>
      </div>
    </div>
  </section>

  <!-- 型二：时间型 -->
  <section class="section">
    <div class="card">
      <div class="demo-head"><span class="demo-tag">演示态：时间型</span></div>
      <div class="form-title">中餐来不及做</div>
      <div class="form-note">符合要求的菜最少要 50 分钟，超出你设的「标准 40 分钟」时长档。</div>
      <div class="opts">
        <a class="opt" href="#">明天中餐放宽到 60 分钟</a>
        <a class="opt" href="#">换一批 20 分钟快手菜</a>
      </div>
      <div class="btn-row">
        <a class="btn" href="generating.html">调好重新生成</a>
      </div>
    </div>
  </section>

  <p class="img-note">出不了就说原因、给调整出路；连不上服务则提示「服务未连接」可重试，绝不显示假菜单</p>
</div>
</body>
</html>
