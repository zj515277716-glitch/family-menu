<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登录门 · 全套屏原型 S-01</title>
<link rel="stylesheet" href="../style.css?v=4">
<link rel="stylesheet" href="./v3.css?v=5">
</head>
<body>
<div class="page">
  <div class="proto-badge"><span>全套屏原型 · 方向① v3 网格卡片风 · S-01 登录门</span></div>

  <div class="gate">
    <div class="gate-title">家庭菜谱</div>
    <p class="gate-sub">晚上 10 分钟，定好明天一家人的三餐</p>

    <div class="card">
      <div class="form-title">家庭口令</div>
      <div class="form-note">只有家里人知道；输对一次，这台设备以后直接进</div>
      <input class="input" type="password" placeholder="请输入口令" aria-label="家庭口令">
      <p class="field-err">口令不对，请再试一次　<span class="demo-tag">演示态：错误提示</span></p>
      <div class="btn-row">
        <a class="btn" href="a.html">进入</a>
      </div>
    </div>

    <p class="img-note">连续输错太多次会请稍等再试 · 口令只存在家里这台服务器上</p>
  </div>
</div>
</body>
</html>
